<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gem TD</title>
    <link rel="icon" href="data:,">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .hidden {
            display: none !important;
        }

        body {
            width: 100vw;
            height: 100vh;
            background-color: #1a1a2e;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        #game {
            display: block;
            background-color: #16213e;
            border: 2px solid #0f3460;
            max-width: 90vw;
            max-height: 90vh;
        }

        #loading {
            color: #00d4ff;
            font-size: 24px;
            text-align: center;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        #title {
            color: #00d4ff;
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
        }

        #version {
            font-size: 16px;
            font-weight: normal;
            opacity: 0.6;
            vertical-align: middle;
        }
    </style>
</head>
<body>
    <div id="title">Gem TD <span id="version">v0.4.0</span></div>
    <canvas id="game"></canvas>
    <div id="loading">Loading...</div>

    <script type="module" src="js/gameloop.js"></script>
</body>
</html>
